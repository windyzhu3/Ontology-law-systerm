services:
  identity-db:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    entrypoint: ["/bin/sh", "/r1/postgres-entrypoint.sh", "identity"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/r1-secrets/identity-db-cert", "-c", "ssl_key_file=/run/r1-secrets/identity-db-key", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: identity_only
      POSTGRES_USER: identity_only
      POSTGRES_PASSWORD_FILE: /run/r1-secrets/identity-db-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_only -d identity_only"]
      interval: 2s
      timeout: 2s
      retries: 60
    secrets: [identity-db-password, identity-db-cert, identity-db-key]
    volumes:
      - identity-db-data:/var/lib/postgresql
      - ./runtime/postgres-entrypoint.sh:/r1/postgres-entrypoint.sh:ro
    networks: [identity]
    restart: "no"

  keycloak-files:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    user: "0:0"
    entrypoint: ["/bin/sh", "/r1/prepare-keycloak-files.sh"]
    secrets: [identity-db-password, ca, keycloak-cert, keycloak-key, realm]
    volumes:
      - keycloak-config:/prepared/config
      - keycloak-import:/prepared/import
      - ./runtime/prepare-keycloak-files.sh:/r1/prepare-keycloak-files.sh:ro
    networks: [identity]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:88943b6ad06d6293a239f0dfca5acec64218c9b3ab327bf9c936acf408a6ae3b
    depends_on:
      identity-db: {condition: service_healthy}
      keycloak-files: {condition: service_completed_successfully}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_DB_PASSWORD="$$(</opt/keycloak/conf/r1/db-password)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/identity_only?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/r1/ca.pem
      KC_DB_USERNAME: identity_only
      KC_HOSTNAME: https://localhost:29443
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/r1/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/r1/server.key
      KC_FEATURES_DISABLED: impersonation,parameterized-scopes
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
    ports: ["127.0.0.1:29443:8443"]
    volumes:
      - keycloak-config:/opt/keycloak/conf/r1:ro
      - keycloak-import:/opt/keycloak/data/import:ro
    networks: [identity]
    restart: "no"

  business-db:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    entrypoint: ["/bin/sh", "/r1/postgres-entrypoint.sh", "business"]
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/r1-secrets/business-db-cert", "-c", "ssl_key_file=/run/r1-secrets/business-db-key", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: law_contract_runtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/r1-secrets/business-superuser-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d law_contract_runtime"]
      interval: 2s
      timeout: 2s
      retries: 60
    ports: ["127.0.0.1:29446:5432"]
    secrets: [business-superuser-password, business-db-cert, business-db-key, migrator-password, api-db-password, worker-db-password]
    volumes:
      - business-db-data:/var/lib/postgresql
      - ./runtime/postgres-entrypoint.sh:/r1/postgres-entrypoint.sh:ro
      - ./runtime/init-business-db.sh:/docker-entrypoint-initdb.d/010-r1-roles.sh:ro
    networks: [business]
    restart: "no"

  flyway:
    image: redgate/flyway@sha256:c093a247b19ff09a6a72774569171ee355fff2ae44ceba4a4aa4b23235d99c93
    depends_on:
      business-db: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/r1/flyway-entrypoint.sh"]
    environment:
      FLYWAY_URL: jdbc:postgresql://business-db:5432/law_contract_runtime?sslmode=verify-full&sslrootcert=/r1/ca.pem
      FLYWAY_USER: law_schema_migrator
      FLYWAY_DEFAULT_SCHEMA: platform_meta
      FLYWAY_SCHEMAS: identity,audit,responsibility,execution,external_action,evidence,party,lead,opportunity,conflict,contract,transfer,platform_meta
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_PLACEHOLDERS_APP_COMMAND_ROLE: law_app_command
      FLYWAY_PLACEHOLDERS_APP_QUERY_ROLE: law_app_query
      FLYWAY_PLACEHOLDERS_AUDIT_APPEND_ROLE: law_audit_append
      FLYWAY_PLACEHOLDERS_APP_WORKER_ROLE: law_app_worker
    secrets: [migrator-password]
    volumes:
      - ../database/schema-contract-52-plus-2/generated/db/migration:/flyway/sql:ro
      - ${R1_RUNTIME:?prepared runtime required}/certs/ca.pem:/r1/ca.pem:ro
      - ./runtime/flyway-entrypoint.sh:/r1/flyway-entrypoint.sh:ro
    networks: [business]
    restart: "no"

  runtime-logins:
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    depends_on:
      flyway: {condition: service_completed_successfully}
    entrypoint: ["/bin/sh", "/r1/provision-runtime-logins.sh"]
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /r1/ca.pem
    secrets: [business-superuser-password, api-db-password, worker-db-password]
    volumes:
      - ./runtime/provision-runtime-logins.sh:/r1/provision-runtime-logins.sh:ro
      - ../backend/src/test/resources/db/bootstrap-runtime-logins.sql:/r1/bootstrap-runtime-logins.sql:ro
      - ${R1_RUNTIME:?prepared runtime required}/deployment-state.sql:/r1/deployment-state.sql:ro
      - ${R1_RUNTIME:?prepared runtime required}/certs/ca.pem:/r1/ca.pem:ro
    networks: [business]
    restart: "no"

networks:
  identity: {internal: true}
  business: {internal: true}

volumes:
  identity-db-data:
  business-db-data:
  keycloak-config:
  keycloak-import:

secrets:
  identity-db-password: {file: "${R1_RUNTIME:?prepared runtime required}/secrets/identity-db-password.txt"}
  business-superuser-password: {file: "${R1_RUNTIME:?prepared runtime required}/secrets/business-superuser-password.txt"}
  migrator-password: {file: "${R1_RUNTIME:?prepared runtime required}/secrets/migrator-password.txt"}
  api-db-password: {file: "${R1_RUNTIME:?prepared runtime required}/secrets/api-db-password.txt"}
  worker-db-password: {file: "${R1_RUNTIME:?prepared runtime required}/secrets/worker-db-password.txt"}
  identity-db-cert: {file: "${R1_RUNTIME:?prepared runtime required}/certs/identity-db.crt"}
  identity-db-key: {file: "${R1_RUNTIME:?prepared runtime required}/certs/identity-db.key"}
  business-db-cert: {file: "${R1_RUNTIME:?prepared runtime required}/certs/business-db.crt"}
  business-db-key: {file: "${R1_RUNTIME:?prepared runtime required}/certs/business-db.key"}
  ca: {file: "${R1_RUNTIME:?prepared runtime required}/certs/ca.pem"}
  keycloak-cert: {file: "${R1_RUNTIME:?prepared runtime required}/certs/keycloak.crt"}
  keycloak-key: {file: "${R1_RUNTIME:?prepared runtime required}/certs/keycloak.key"}
  realm: {file: "${R1_RUNTIME:?prepared runtime required}/keycloak/r1-e2e-realm.json"}
