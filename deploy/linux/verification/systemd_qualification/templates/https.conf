# Included from nginx http{}; install only after valid public certificate exists.
server {
    listen 127.0.0.1:29848 ssl default_server;
    server_name 127.0.0.1;
    if ($host != 127.0.0.1) { return 421; }
    # Reject ambiguous raw paths before nginx URI normalization.
    if ($request_uri ~* "^[^?]*(%2e|%2f|%5c|\\\\|\.\.)") { return 404; }
    if ($request_uri ~ "^//") { return 404; }
    ssl_certificate /run/ols-tls-qualification/materials/old-public.crt;
    ssl_certificate_key /run/ols-tls-qualification/materials/old-public.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OLS_TLS:10m;
    ssl_session_tickets off;
    disable_symlinks on from=$document_root;
    index index.html;
    client_max_body_size 21m;
    server_tokens off;
    # OIDC URLs contain sensitive authorization codes; never log query strings.
    access_log off;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~* ^/(?:metrics|health|actuator|api/(?:metrics|health|actuator))(?:/|$) { return 404; }
    location ~ ^/(realms|resources)(/|$) {
proxy_pass https://127.0.0.1:29846;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host 127.0.0.1;
proxy_set_header X-Forwarded-Host 127.0.0.1;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 29848;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Language $http_accept_language;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
proxy_set_header If-Match $http_if_match;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Appointment-Id $http_x_appointment_id;
proxy_set_header X-On-Behalf-Appointment-Id $http_x_on_behalf_appointment_id;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name localhost;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /run/ols-tls-qualification/runtime/certs/ca.pem;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_redirect off;
    }
    location ~ "^/admin/realms/qualification/users(?:/[A-Za-z0-9_-]{1,2048})?$" {
        satisfy all;
        allow 127.0.0.1/32;
        allow 127.0.0.2/32; # VERIFIED_NATIVE_INSTANCE_POD
    deny all;
        limit_except GET { deny all; }
proxy_pass https://127.0.0.1:29846;
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host 127.0.0.1;
proxy_set_header X-Forwarded-Host 127.0.0.1;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 29848;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Language $http_accept_language;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
proxy_set_header If-Match $http_if_match;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Appointment-Id $http_x_appointment_id;
proxy_set_header X-On-Behalf-Appointment-Id $http_x_on_behalf_appointment_id;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name localhost;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /run/ols-tls-qualification/runtime/certs/ca.pem;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_redirect off;
    }
  location ~ ^/admin/(?:realms|master)(?:/|$) { return 404; }
    location / {
proxy_pass https://127.0.0.1:29847;
proxy_http_version 1.1;
proxy_pass_request_headers on;
proxy_set_header Host 127.0.0.1;
proxy_set_header X-Forwarded-Host 127.0.0.1;
