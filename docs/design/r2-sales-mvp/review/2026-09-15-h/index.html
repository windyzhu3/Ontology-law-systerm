<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T04 · H补充高保真</title><style>body{font:15px "Microsoft YaHei",sans-serif;margin:0;background:#f8f7f7;color:#2c2c34}header{padding:16px 24px}select{padding:8px;font:inherit}iframe{width:100%;height:calc(100vh - 150px);border:1px solid #dfe0e4;background:white;box-sizing:border-box}p{margin:8px 0}</style></head><body><header><strong>H · 结束商机补充稿 · 已确认</strong><p>审阅工具：全部为合成静态数据，确认按钮仅切换示例状态，不调用业务接口。</p><label>审阅场景 <select id="scene"></select></label></header><iframe title="商机台账结束流程" src="app.html"></iframe><script>const scenes={entry:'正常入口',waiting:'等待中的商机',edit:'填写结束原因',confirm:'核对结束影响',closed:'已结束',stale:'依据变化',unknown:'结果未知',revoked:'权限变化',readonly:'只读',blocked:'已有后续业务'};document.querySelector('select').innerHTML=Object.entries(scenes).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');document.querySelector('select').onchange=e=>document.querySelector('iframe').src='app.html?scene='+e.target.value;</script></body></html>
