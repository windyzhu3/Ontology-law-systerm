<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T06 · J 高保真审阅</title><style>body{font:15px "Microsoft YaHei",sans-serif;margin:0;background:#f8f7f7;color:#2c2c34}header{padding:14px 24px}select,button{font:inherit;padding:7px;max-width:100%}iframe{display:block;width:100%;height:calc(100vh - 180px);border:1px solid #dfe0e4;background:white;box-sizing:border-box;margin:auto}p{margin:7px 0}.tools{display:flex;flex-wrap:wrap;gap:12px}</style></head><body><header><strong>J · T06 材料接收与版本 · 待确认</strong><p>审阅工具：仅合成数据；模拟选文件，不读取或上传本机文件。产品页直接使用 E 母版 CSS。</p><div class="tools"><label>场景 <select id="scene"></select></label><label>画幅 <select id="width"><option value="100%">桌面</option><option value="390px">390px</option><option value="360px">360px</option></select></label></div></header><iframe title="T06材料接收交互" src="app.html"></iframe><script>const scenes={entry:'01 商机次级入口',list:'02 材料清单与缺项',receive:'03 接收新材料',selected:'04 核对所选材料',checking:'05 正在检查文件',review:'06 人工确认归属',saved:'07 接收后继续原事项',version:'08 补交新版',history:'09 旧版本查看',waiting:'10 等待期间收材料',unconfirmed:'11 客户资料尚未确认',stale:'12 负责人或依据变化',unknown:'13 接收结果未知',rejected:'14 文件检查未通过',readonly:'15 只读',closed:'16 已结束',revoked:'17 权限变化',failed:'18 读取失败',loading:'19 正在加载'};const pick=document.querySelector('#scene');pick.innerHTML=Object.entries(scenes).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');pick.onchange=()=>document.querySelector('iframe').src='app.html?scene='+pick.value;document.querySelector('#width').onchange=e=>document.querySelector('iframe').style.width=e.target.value;</script></body></html>
