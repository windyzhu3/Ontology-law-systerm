<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T07 · K 高保真审阅</title><style>body{font:15px "Microsoft YaHei",sans-serif;margin:0;background:#f8f7f7;color:#2c2c34}header{padding:14px 24px}select,button{font:inherit;padding:7px;max-width:100%}iframe{display:block;width:100%;height:calc(100vh - 180px);border:1px solid #dfe0e4;box-sizing:border-box;margin:auto}p{margin:7px 0}.tools{display:flex;flex-wrap:wrap;gap:12px}</style></head><body><header><strong>K · T07 收费方案与报价 · 待确认</strong><p>仅合成高保真。模拟交付、证据与审批，不产生真实业务。产品区域直接引用冻结 E 母版。</p><div class="tools"><label>场景 <select id="scene"></select></label><label>画幅 <select id="width"><option value="100%">桌面</option><option value="390px">390px</option><option value="360px">360px</option></select></label></div></header><iframe title="T07报价业务交互" src="app.html"></iframe><script>const scenes={"entry": "01 商机报价入口", "prepare": "02 收费方案与明细", "draft": "03 草稿恢复", "review": "04 核对报价版本", "created": "05 新版本已形成", "submit": "06 提交报价审批", "pending": "07 等待审批", "approval": "08 有权人作出决定", "returned": "09 退回修改", "authorized": "10 报价已获授权", "delivery": "11 人工交付留证", "deliveryReview": "12 核对交付事实", "issued": "13 已交付待客户回复", "response": "14 记录四态客户回复", "responseReview": "15 核对客户回复", "accepted": "16 接受后衔接合同准备", "deferred": "17 暂不接受约定再跟进", "rejected": "18 明确拒绝的后续处置", "ambiguous": "19 回复不明确继续核实", "revise": "20 修订形成新版本", "history": "21 历史版本与准确引用", "missing": "22 客户资料尚未确认", "expired": "23 报价已过有效期", "unassigned": "24 无合格审批人", "stale": "25 依据或版本变化", "unknown": "26 原提交结果未知", "readonly": "27 只读资料", "closed": "28 商机已结束", "revoked": "29 权限变化", "failed": "30 读取失败", "loading": "31 正在读取", "handoff": "32 后继待办同步中", "waiting": "33 普通跟进仍在等待", "withinAuthority": "34 权限内具名授权", "partialApproval": "35 多位审批尚未齐备"};const pick=document.querySelector('#scene');pick.innerHTML=Object.entries(scenes).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');pick.onchange=()=>document.querySelector('iframe').src='app.html?scene='+pick.value;document.querySelector('#width').onchange=e=>document.querySelector('iframe').style.width=e.target.value;</script></body></html>
