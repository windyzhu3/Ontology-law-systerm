user nginx;
worker_processes auto;
pid /run/ols-tls-qualification/nginx/nginx.pid;
error_log /run/ols-tls-qualification/evidence/nginx.error warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    client_body_temp_path /run/ols-tls-qualification/nginx/temp/client;
    proxy_temp_path /run/ols-tls-qualification/nginx/temp/proxy;
    fastcgi_temp_path /run/ols-tls-qualification/nginx/temp/fastcgi;
    uwsgi_temp_path /run/ols-tls-qualification/nginx/temp/uwsgi;
    scgi_temp_path /run/ols-tls-qualification/nginx/temp/scgi;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    include /run/ols-tls-qualification/nginx/conf.d/*.conf;
}
