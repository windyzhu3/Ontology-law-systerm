<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>R · 管理查询补稿（已确认）</title><style>body{margin:0;font:15px "Microsoft YaHei",sans-serif;background:#f8f7f7;color:#2c2c34}header{padding:14px 24px}p{margin:8px 0}select{font:inherit;padding:6px;max-width:100%}iframe{display:block;width:100%;height:calc(100vh - 200px);margin:auto;border:1px solid #dfe0e4;box-sizing:border-box}</style><header><strong>R · 收款与转案管理查询（已确认）</strong><p>沿用 Q1 四份共用 CSS，合同台账内切换视图。全部为合成数据；前往办理复用 P1/Q 原卡，不新增业务命令。</p><label>场景 <select id="scene"><option value="payments">收款：待核对、部分到账、退回、完成</option><option value="transfer">转案：待提交、审查、补正、接收与分类</option><option value="readonly">只读，无办理权限</option><option value="empty">无匹配记录</option><option value="loading">加载中</option><option value="error">读取失败与重试</option><option value="revoked">权限变化清空</option></select></label> <label>宽度 <select id="width"><option value="100%">桌面</option><option value="390px">390px</option><option value="360px">360px</option></select></label><p>核对重点：视图切换是否清楚、详情是否足够、原工作卡衔接与移动端是否一致。</p></header><iframe title="管理查询高保真" src="app.html?scene=payments"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#scene').onchange=e=>frame.src='app.html?scene='+e.target.value;document.querySelector('#width').onchange=e=>frame.style.width=e.target.value;</script></body></html>
