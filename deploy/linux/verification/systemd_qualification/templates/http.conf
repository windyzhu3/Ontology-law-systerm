server {
    listen 127.0.0.1:29845 default_server;
    server_name 127.0.0.1;
    if ($host != 127.0.0.1) { return 421; }
    location ^~ /.well-known/acme-challenge/ {
        root /run/ols-tls-qualification/challenges;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /.well-known/pki-validation/QUALIFICATION.txt { root /run/ols-tls-qualification/challenges; default_type text/plain; try_files $uri =404; }
    location / { return 308 https://127.0.0.1:29848$request_uri; }
}
