      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
          $ref: '#/components/schemas/Instant'
        resultFact:
          $ref: '#/components/schemas/ActionDraftFactRef'

    TaskOccurrenceCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, resultFact]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
          $ref: '#/components/schemas/Instant'
        resultFact:
          $ref: '#/components/schemas/TaskOccurrenceFactRef'

    DecisionRecordCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, resultFact]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
          $ref: '#/components/schemas/Instant'
        resultFact:
