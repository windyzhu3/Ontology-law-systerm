name: R1 preflight (not runtime acceptance)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25.0.4.1"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.20.0"
          cache: npm
      - name: Install pinned Python verification dependencies
        run: python -m pip install -r database/schema-contract-52-plus-2/requirements-dev.txt
      - name: Verify exact JDK build
        run: java -version 2>&1 | grep -F 'Temurin-25.0.4.1+1'
      - name: Activate exact npm
        run: npm install --global npm@11.9.0
      - name: Verify exact npm
        run: test "$(npm --version)" = "11.9.0"
      - name: Install locked repository dependencies
        run: npm ci
      - name: Install Playwright-owned Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run the fixed R1 preflight sequence
        shell: bash
        run: bash scripts/ci/r1-preflight.sh
      - name: Record the preflight boundary
        shell: bash
        run: |
          {
            echo '## R1 preflight only'
            echo 'This run does not execute the real R1 browser acceptance paths.'
            echo 'W09 remains deferred by the user; green preflight is not R1 runtime acceptance or R2 admission.'
          } >> "$GITHUB_STEP_SUMMARY"
