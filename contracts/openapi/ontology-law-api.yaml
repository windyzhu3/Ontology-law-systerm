    LeadAssignmentCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, resultFact]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
          $ref: '#/components/schemas/Instant'
        resultFact:
          $ref: '#/components/schemas/LeadAssignmentFactRef'

    LeadContactResultCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, resultFact]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
          $ref: '#/components/schemas/Instant'
        resultFact:
          $ref: '#/components/schemas/LeadContactResultFactRef'

    FieldError:
      type: object
      additionalProperties: false
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          format: json-pointer
          minLength: 1
          maxLength: 512
        code:
          type: string
          enum: [REQUIRED, INVALID_FORMAT, OUT_OF_RANGE, NOT_ALLOWED, CONDITION_FAILED]
        detail:
          $ref: '#/components/schemas/SafeText200'

    ResourceKind:
      type: string
      enum: [WORKBENCH, TASK, DRAFT, SUBJECT]

    ResourceETag:
      type: string
      minLength: 48
      maxLength: 53
      pattern: '^"(?:wb|task|draft|subject)\.[A-Za-z0-9_-]{43}"$'

    CurrentETag:
      type: object
      additionalProperties: false
      required: [resourceKind, value]
      properties:
        resourceKind:
          $ref: '#/components/schemas/ResourceKind'
        value:
          $ref: '#/components/schemas/ResourceETag'
      allOf:
        - if:
            properties:
              resourceKind: { const: WORKBENCH }
            required: [resourceKind]
          then:
            properties:
              value: { $ref: '#/components/schemas/WorkbenchETag' }
        - if:
            properties:
              resourceKind: { const: TASK }
            required: [resourceKind]
          then:
            properties:
              value: { $ref: '#/components/schemas/TaskETag' }
        - if:
            properties:
              resourceKind: { const: DRAFT }
            required: [resourceKind]
          then:
            properties:
              value: { $ref: '#/components/schemas/DraftETag' }
        - if:
            properties:
              resourceKind: { const: SUBJECT }
            required: [resourceKind]
          then:
            properties:
              value: { $ref: '#/components/schemas/SubjectETag' }

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, instance, retryPolicy]
      properties:
        type:
          type: string
          format: uri
          pattern: '^[A-Za-z][A-Za-z0-9+.-]*://'
          maxLength: 512
        title:
          $ref: '#/components/schemas/SafeText200'
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          $ref: '#/components/schemas/SafeText500'
        instance:
          type: string
          format: uri-reference
          pattern: '^/'
          maxLength: 512
        retryPolicy:
          $ref: '#/components/schemas/RetryPolicy'
        fieldErrors:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/FieldError'
        currentETag:
          $ref: '#/components/schemas/CurrentETag'
        receiptRef:
          $ref: '#/components/schemas/ReceiptRef'
      allOf:
        - if:
            properties:
              code:
                enum: [VALIDATION_FAILED]
            required: [code]
          then:
            properties:
              status:
                enum: [400]
              retryPolicy:
                enum: [SAME_KEY_AFTER_FIX]
            required: [fieldErrors]
          else:
            not:
              required: [fieldErrors]
        - if:
            properties:
              code:
                enum: [IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID]
            required: [code]
          then:
            properties:
              status:
                enum: [400]
              retryPolicy:
                enum: [SAME_KEY_AFTER_FIX]
        - if:
            properties:
              code:
                enum: [UNAUTHENTICATED]
            required: [code]
          then:
            properties:
              status:
                enum: [401]
              retryPolicy:
                enum: [SAME_KEY_AFTER_REAUTH]
        - if:
            properties:
              code:
                enum: [NOT_AUTHORIZED, APPOINTMENT_INACTIVE]
            required: [code]
          then:
            properties:
              status:
                enum: [403]
              retryPolicy:
                enum: ['NO']
        - if:
            properties:
              code:
                enum: [NOT_FOUND]
            required: [code]
          then:
            properties:
              status:
                enum: [404]
              retryPolicy:
                enum: ['NO']
        - if:
            properties:
              code:
                enum: [COMMAND_PAYLOAD_CONFLICT]
            required: [code]
          then:
            properties:
              status:
                enum: [409]
              retryPolicy:
                enum: ['NO']
            required: [receiptRef]
        - if:
            properties:
              code:
                enum: [TASK_NOT_OPEN, TASK_ALREADY_COMPLETED]
            required: [code]
          then:
            properties:
              status:
                enum: [409]
              retryPolicy:
                enum: ['NO']
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [TASK]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [DRAFT_DIGEST_MISMATCH]
            required: [code]
          then:
            properties:
              status:
                enum: [409]
              retryPolicy:
                enum: [NEW_KEY_AFTER_REFRESH]
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [DRAFT]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [INGRESS_COMPLETION_ALREADY_RECORDED]
            required: [code]
          then:
            properties:
              status:
                enum: [409]
              retryPolicy:
                enum: ['NO']
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [SUBJECT]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [STALE_TASK]
            required: [code]
          then:
            properties:
              status:
                enum: [412]
              retryPolicy:
                enum: [NEW_KEY_AFTER_REFRESH]
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [TASK]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [STALE_DRAFT]
            required: [code]
          then:
            properties:
              status:
                enum: [412]
              retryPolicy:
                enum: [NEW_KEY_AFTER_REFRESH]
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [DRAFT]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [STALE_SUBJECT]
            required: [code]
          then:
            properties:
              status:
                enum: [412]
              retryPolicy:
                enum: [NEW_KEY_AFTER_REFRESH]
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [SUBJECT]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [SUPERVISOR_UNRESOLVED, SOURCE_INTAKE_OWNER_UNRESOLVED]
            required: [code]
          then:
            properties:
              status:
                enum: [422]
              retryPolicy:
                enum: [NEW_KEY_AFTER_ADMIN_FIX]
        - if:
            properties:
              code:
                enum: [DRAFT_PRECONDITION_REQUIRED]
            required: [code]
          then:
            properties:
              status:
                enum: [428]
              retryPolicy:
                enum: [SAME_KEY_AFTER_FIX]
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [DRAFT]
        - if:
            properties:
              code:
                enum: [TASK_PRECONDITION_REQUIRED]
            required: [code]
          then:
            properties:
              status:
                enum: [428]
              retryPolicy:
                enum: [SAME_KEY_AFTER_FIX]
              currentETag:
                allOf:
                  - $ref: '#/components/schemas/CurrentETag'
                  - properties:
                      resourceKind:
                        enum: [TASK]
            required: [currentETag]
        - if:
            properties:
              code:
                enum: [RATE_LIMITED]
            required: [code]
          then:
            properties:
              status:
                enum: [429]
              retryPolicy:
                enum: [SAME_KEY_AFTER_BACKOFF]
        - if:
            properties:
              code:
                enum: [INTERNAL_ERROR]
            required: [code]
          then:
            properties:
              status:
                enum: [500]
              retryPolicy:
                enum: [SAME_KEY_AFTER_BACKOFF]
        - if:
            properties:
              code:
                enum: [SERVICE_UNAVAILABLE]
            required: [code]
          then:
            properties:
              status:
                enum: [503]
              retryPolicy:
                enum: [SAME_KEY_AFTER_BACKOFF]
        - if:
            properties:
              code:
                enum:
                  - VALIDATION_FAILED
                  - IDEMPOTENCY_KEY_REQUIRED
                  - IDEMPOTENCY_KEY_INVALID
                  - UNAUTHENTICATED
                  - NOT_AUTHORIZED
                  - APPOINTMENT_INACTIVE
                  - NOT_FOUND
                  - COMMAND_PAYLOAD_CONFLICT
                  - SUPERVISOR_UNRESOLVED
                  - SOURCE_INTAKE_OWNER_UNRESOLVED
                  - RATE_LIMITED
                  - INTERNAL_ERROR
                  - SERVICE_UNAVAILABLE
            required: [code]
          then:
            not:
              required: [currentETag]
