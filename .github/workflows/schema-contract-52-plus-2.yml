name: schema-contract-52-plus-2

on:
  pull_request:
    paths:
      - "database/schema-contract-52-plus-2/**"
      - "docs/**"
      - "scripts/baseline/**"
      - ".github/workflows/schema-contract-52-plus-2.yml"
      - ".gitignore"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "database/schema-contract-52-plus-2/**"
      - "docs/**"
      - "scripts/baseline/**"
      - ".github/workflows/schema-contract-52-plus-2.yml"
      - ".gitignore"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: schema-contract-52-plus-2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database/schema-contract-52-plus-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/schema-contract-52-plus-2/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python generate.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_generated_sql.py

  runtime-postgresql-18:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: database/schema-contract-52-plus-2/requirements-dev.txt
      - name: Install verification dependencies
        working-directory: database/schema-contract-52-plus-2
        run: python -m pip install -r requirements-dev.txt
      - name: Verify PostgreSQL 18 runtime contract
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/baseline/verify_baseline.py
          cd database/schema-contract-52-plus-2
          python3 generate.py --check
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_generated_sql.py
          python3 -m unittest discover -s runtime/tests -v
          python3 runtime/verify_runtime.py verify --ci-only --runs 2 --evidence-dir ../../.artifacts/schema-runtime
      - name: Summarize PostgreSQL 18 runtime verification
        id: runtime_summary
        if: ${{ always() }}
        env:
          RUNTIME_STEP_OUTCOME: ${{ steps.runtime.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .artifacts/schema-runtime-ci/ci-runtime-summary.json \
             || ! -f .artifacts/schema-runtime-ci/ci-job-summary.md ]]; then
            python3 database/schema-contract-52-plus-2/runtime/verify_runtime.py \
              export-ci-fallback --workflow-step-outcome "${RUNTIME_STEP_OUTCOME}"
          fi
          python3 database/schema-contract-52-plus-2/runtime/verify_runtime.py validate-ci-artifact
          cat .artifacts/schema-runtime-ci/ci-job-summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload PostgreSQL 18 structured runtime evidence
        if: ${{ always() && steps.runtime_summary.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: schema-runtime-postgresql-18-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/schema-runtime-ci/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
