components:
  securitySchemes:
    publicBearer:
      type: http
      scheme: bearer
    internalMutualTls:
      type: mutualTLS

  parameters:
    IdentityIdPath: {
      "name": "id",
      "in": "path",
      "required": true,
      "schema": {
        "$ref": "#/components/schemas/Uuid"
      }
    }
    AppointmentSelection: {
      "name": "X-Appointment-Id",
      "in": "header",
      "required": false,
      "schema": {
        "$ref": "#/components/schemas/Uuid"
      },
      "description": "Own server-provided selection only; omitted with multiple appointments safely requires explicit selection."
    }
    IdentityIfMatch: {
      "name": "If-Match",
      "in": "header",
      "required": true,
      "schema": {
        "$ref": "#/components/schemas/IdentityETag"
      }
    }
    IdentityLimit: {
      "name": "limit",
      "in": "query",
      "required": false,
      "schema": {
        "type": "integer",
