<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T01 负责人异常 · F 补充稿已确认</title><link rel="stylesheet" href="../2026-09-14-e/review.css"></head><body><header class="review-controls"><div><strong>T01 负责人异常 · 已确认</strong><small>沿用 E 母版 · 合成数据，不提交真实业务</small></div><label>审阅状态<select id="state"><option value="initial">01 首次责任未落实</option><option value="open">02 办理中断</option><option value="due">03 到期未接续</option><option value="future">04 未来等待交接</option><option value="none">05 无合格接手人及协调</option><option value="changed">06 办理依据变化</option><option value="revoked">07 处置权限撤销</option><option value="hidden">08 查看权限撤销</option><option value="operations">09 主管无法唯一确定</option><option value="resolved">10 他人已处理</option><option value="waiting">11 接手人未来等待</option><option value="readonly">12 仅有查看权</option><option value="empty">13 无异常</option><option value="failed">14 查询失败</option></select></label><label>模拟响应<select id="response"><option value="success">正常返回</option><option value="unknown">结果未知</option></select></label><button id="mobile" aria-pressed="false">查看小屏</button><a href="README.md" target="_blank">范围与验收说明</a></header><main class="review-stage"><iframe id="preview" src="app.html" title="T01 负责人异常交互稿"></iframe></main><script>
const frame=document.querySelector('#preview'),state=document.querySelector('#state'),response=document.querySelector('#response');const send=data=>frame.contentWindow.postMessage(data,location.origin);state.onchange=()=>send({type:'f-scene',value:state.value});response.onchange=()=>send({type:'outcome',value:response.value});document.querySelector('#mobile').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));document.querySelector('.review-stage').classList.toggle('mobile',on);e.currentTarget.textContent=on?'查看桌面':'查看小屏';};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.type==='busy'){state.disabled=e.data.value;response.disabled=e.data.value;}if(e.data.type==='f-state')state.value=e.data.value;});
</script></body></html>
