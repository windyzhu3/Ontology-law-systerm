    ReceiptRef:
      type: object
      additionalProperties: false
      required: [commandId, href]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        href:
          type: string
          pattern: '^/api/v1/commands/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/receipt$'

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_INVALID
        - UNAUTHENTICATED
        - NOT_AUTHORIZED
        - APPOINTMENT_INACTIVE
        - NOT_FOUND
        - COMMAND_PAYLOAD_CONFLICT
        - TASK_NOT_OPEN
        - TASK_ALREADY_COMPLETED
        - DRAFT_DIGEST_MISMATCH
        - INGRESS_COMPLETION_ALREADY_RECORDED
        - STALE_TASK
        - STALE_DRAFT
        - STALE_SUBJECT
        - SUPERVISOR_UNRESOLVED
        - SOURCE_INTAKE_OWNER_UNRESOLVED
        - DRAFT_PRECONDITION_REQUIRED
        - TASK_PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE

    TerminalRejectionCode:
      type: string
      description: >-
        Post-slot business rejection codes that may be persisted in a terminal
        REJECTED CommandReceipt. Pre-slot, payload-conflict, rate-limit, and
        technical failures never create a new receipt.
      enum:
        - NOT_AUTHORIZED
        - APPOINTMENT_INACTIVE
        - TASK_NOT_OPEN
        - TASK_ALREADY_COMPLETED
        - DRAFT_DIGEST_MISMATCH
        - INGRESS_COMPLETION_ALREADY_RECORDED
        - STALE_TASK
        - STALE_DRAFT
        - STALE_SUBJECT
        - SUPERVISOR_UNRESOLVED
        - SOURCE_INTAKE_OWNER_UNRESOLVED

    RetryPolicy:
      type: string
      enum:
        - 'NO'
        - SAME_KEY_AFTER_FIX
        - SAME_KEY_AFTER_REAUTH
        - NEW_KEY_AFTER_REFRESH
        - NEW_KEY_AFTER_ADMIN_FIX
        - SAME_KEY_AFTER_BACKOFF

    SuccessfulCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, resultFact]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
          $ref: '#/components/schemas/Instant'
        resultFact:
          $ref: '#/components/schemas/PublicFactRef'

    RejectedCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, rejectionCode]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          const: REJECTED
        completedAt:
          $ref: '#/components/schemas/Instant'
        rejectionCode:
          $ref: '#/components/schemas/TerminalRejectionCode'

    CommandReceipt:
      oneOf:
        - $ref: '#/components/schemas/SuccessfulCommandReceipt'
        - $ref: '#/components/schemas/RejectedCommandReceipt'

    LeadCommandReceipt:
      type: object
      additionalProperties: false
      required: [commandId, receiptId, outcome, completedAt, resultFact]
      properties:
        commandId:
          $ref: '#/components/schemas/Uuid'
        receiptId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [SUCCEEDED, NO_CHANGE]
        completedAt:
