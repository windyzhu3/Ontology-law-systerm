<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T03 商机台账 · G 已确认</title><link rel="stylesheet" href="../2026-09-14-e/review.css"></head><body><header class="review-controls"><div><strong>T03 商机台账 · 补充状态已确认</strong><small>E 正常态保持已批准 · 静态合成数据，无 API</small></div><label>审阅状态<select id="state"><option value="normal">00 E 正常态参照（已批准）</option><option value="loading">01 读取中</option><option value="empty">02 授权范围无记录</option><option value="nomatch">03 搜索无匹配</option><option value="readonly">04 仅有查看权</option><option value="other">05 他人负责</option><option value="future">06 等待约定时间</option><option value="stale">07 待办已变化</option><option value="revoked">08 查看权限撤销</option><option value="failed">09 读取失败</option><option value="unknown">10 办理资格暂未确认</option><option value="progressHidden">11 进展不可展示</option></select></label><button id="mobile" aria-pressed="false">查看小屏</button><a href="README.md" target="_blank">范围与确认说明</a></header><main class="review-stage"><iframe id="preview" src="app.html" title="T03 商机台账补充状态交互稿"></iframe></main><script>
const frame=document.querySelector('#preview'),state=document.querySelector('#state');state.onchange=()=>frame.contentWindow.postMessage({type:'g-scene',value:state.value},location.origin);document.querySelector('#mobile').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));document.querySelector('.review-stage').classList.toggle('mobile',on);e.currentTarget.textContent=on?'查看桌面':'查看小屏';};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.type==='g-state')state.value=e.data.value;});
</script></body></html>
