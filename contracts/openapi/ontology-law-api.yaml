        currentCard:
          oneOf:
            - $ref: '#/components/schemas/CurrentCard'
            - type: 'null'
        nextSummaries:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: '#/components/schemas/NextSummary'
        waitingCount:
          type: integer
          minimum: 0
        chatComposer:
          $ref: '#/components/schemas/ChatComposer'
      x-cross-field-invariant: >-
        If currentCard is null then chatComposer.targetTaskId is null and enabled is false;
        otherwise targetTaskId equals currentCard.taskId.
      allOf:
        - if:
            properties:
              currentCard: { const: null }
            required: [currentCard]
          then:
            properties:
              chatComposer:
                properties:
                  targetTaskId: { const: null }
                  enabled: { const: false }
          else:
            properties:
              chatComposer:
                properties:
                  targetTaskId:
                    not: { const: null }
                  enabled: { const: true }

