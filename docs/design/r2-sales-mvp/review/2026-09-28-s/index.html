<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>S · 团队待办补稿（已确认）</title><style>body{margin:0;font:15px "Microsoft YaHei",sans-serif;background:#f8f7f7;color:#2c2c34}header{padding:14px 24px}p{margin:8px 0}select{font:inherit;padding:6px;max-width:100%}iframe{display:block;width:100%;height:calc(100vh - 200px);margin:auto;border:1px solid #dfe0e4;box-sizing:border-box}</style><header><strong>S · M02 团队待办与处理记录（已确认）</strong><p>沿用 R 四份共用 CSS；在原团队待办内查询，详情按需展开历史，办理回到原卡。全部为合成演示，不改变真实业务。</p><label>场景 <select id="scene"><option value="tasks">正常待办与逾期</option><option value="waiting">等待与到期未接续</option><option value="exceptions">负责人及衔接异常</option><option value="history">已处理及操作记录</option><option value="readonly">只读任职</option><option value="operations">运营最小异常摘要</option><option value="changed">办理前任务已变化</option><option value="empty">空态</option><option value="loading">加载</option><option value="error">失败与重试</option><option value="revoked">失权清空</option></select></label> <label>宽度 <select id="width"><option value="100%">桌面</option><option value="390px">390px</option><option value="360px">360px</option></select></label><p>核对：列表与详情是否简洁、等待与异常是否区分、只读不越权、原卡接续与移动端是否一致。</p></header><iframe title="团队待办高保真" src="app.html?scene=tasks"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#scene').onchange=e=>frame.src='app.html?scene='+e.target.value;document.querySelector('#width').onchange=e=>frame.style.width=e.target.value;</script></body></html>
