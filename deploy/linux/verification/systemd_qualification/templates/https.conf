proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Language $http_accept_language;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
proxy_set_header If-Match $http_if_match;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Appointment-Id $http_x_appointment_id;
proxy_set_header X-On-Behalf-Appointment-Id $http_x_on_behalf_appointment_id;
proxy_set_header Connection "";
proxy_ssl_server_name on;
proxy_ssl_name localhost;
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /run/ols-tls-qualification/runtime/certs/ca.pem;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_redirect off;
    }
}
