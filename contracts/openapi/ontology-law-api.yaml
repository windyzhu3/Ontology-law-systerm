  /api/v1/commands/{commandId}/receipt:
    get:
      tags: [CommandReceipts]
      operationId: getCommandReceipt
      summary: Recover the terminal receipt for one caller command UUID
      description: >-
        ADR-0013 / R1-HTTP-V1.3: only the identical original trusted Actor and on-behalf pair may recover a public command receipt.
        R1_RECEIPT_RECOVERY_METADATA_LOOKUP_V1 obtains bounded metadata inside Audit Owner; current Owner authorization is recomputed without rerunning terminal command eligibility.
        READ_COMMAND_RECEIPT Audit must commit with acknowledgement before serialization. All responses use Cache-Control: no-store; no success ETag or 304.
        Missing or invalid same-Actor recovery metadata safely fails with existing SERVICE_UNAVAILABLE; wrong Actor, Tenant or internal recovery is NOT_FOUND.
        Legacy recovery requires the complete original request and original Idempotency-Key at its original endpoint, with zero replay delta; never automatically use a new key.
      security:
        - publicBearer: []
      x-tenant-source: ACTOR_CONTEXT
      x-subject-binding: COMMAND_ID_AND_ACTOR_SCOPE
      x-error-codes:
        - UNAUTHENTICATED
        - NOT_AUTHORIZED
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      parameters:
        - $ref: '#/components/parameters/CommandIdPath'
        - $ref: '#/components/parameters/AppointmentSelection'
      responses:
        '200':
          description: 'Original terminal receipt projection, disclosed only after READ_COMMAND_RECEIPT Audit commit acknowledgement; Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              examples:
                receipt:
                  $ref: '#/components/examples/CommandReceiptResponse'
        '401':
          $ref: '#/components/responses/PublicUnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
