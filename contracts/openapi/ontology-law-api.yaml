  schemas:
    IdentityETag: {
      "type": "string",
      "minLength": 54,
      "maxLength": 54,
      "pattern": "^\"identity\\.[A-Za-z0-9_-]{43}\"$"
    }
    IdentityCursorV1: {
      "type": "string",
      "minLength": 1,
      "maxLength": 2048,
      "pattern": "^[A-Za-z0-9_-]+$"
    }
    IdentityChoiceV1: {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "id",
        "label"
      ],
      "properties": {
        "id": {
          "$ref": "#/components/schemas/Uuid"
        },
        "label": {
          "$ref": "#/components/schemas/SafeText200"
        }
      }
    }
    GrantableAuthorityCodeV1: {
      "type": "string",
      "enum": [
        "LEAD_CAPTURE",
        "LEAD_INGRESS_RESOLVE",
        "LEAD_INGRESS_COMPLETE",
        "LEAD_ASSIGN",
        "LEAD_ROUTING_DECIDE",
        "SOURCE_INTAKE_REQUEST_ACK",
        "SALES_CONTACT_OWNER",
        "LEAD_VALIDITY_REVIEW"
      ]
    }
    IdentityRoleCodeV1: {
      "type": "string",
      "enum": [
        "INTAKE_OPERATOR",
        "ROUTING_SUPERVISOR",
        "CONTACT_OPERATOR"
      ]
    }
    IdentityAdminPageV1: {
      "type": "string",
      "enum": [
        "PRINCIPALS",
        "ORGANIZATIONS",
        "APPOINTMENTS",
        "AUTHORITY_GRANTS"
      ]
    }
    IdentityOptionKindV1: {
      "type": "string",
      "enum": [
        "PRINCIPAL",
        "ORGANIZATION",
        "APPOINTMENT"
      ]
    }
    SessionContextV1: {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "displayName",
        "state",
        "appointmentChoices",
        "selectedAppointmentId",
        "actorScopeKey",
        "canEnterWorkbench",
        "canEnterIdentityAdmin"
      ],
      "properties": {
        "displayName": {
          "$ref": "#/components/schemas/SafeText200"
        },
        "state": {
          "type": "string",
          "enum": [
            "NO_APPOINTMENT",
            "APPOINTMENT_SELECTION_REQUIRED",
            "READY"
          ]
        },
        "appointmentChoices": {
          "type": "array",
          "maxItems": 50,
          "items": {
            "$ref": "#/components/schemas/IdentityChoiceV1"
          }
        },
        "selectedAppointmentId": {
          "type": [
            "string",
            "null"
          ],
          "format": "uuid"
        },
        "actorScopeKey": {
          "type": [
            "string",
            "null"
          ],
          "pattern": "^ask1\\.[A-Za-z0-9_-]{43}$",
          "maxLength": 48
        },
        "canEnterWorkbench": {
          "type": "boolean"
        },
        "canEnterIdentityAdmin": {
          "type": "boolean"
        }
      },
      "allOf": [
        {
          "if": {
            "properties": {
              "state": {
                "const": "NO_APPOINTMENT"
              }
            },
            "required": [
              "state"
            ]
          },
          "then": {
            "properties": {
              "appointmentChoices": {
                "maxItems": 0
              },
              "selectedAppointmentId": {
                "type": "null"
              },
              "actorScopeKey": {
                "type": "null"
              },
              "canEnterWorkbench": {
                "const": false
              },
              "canEnterIdentityAdmin": {
                "const": false
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "state": {
                "const": "APPOINTMENT_SELECTION_REQUIRED"
              }
            },
            "required": [
              "state"
            ]
          },
          "then": {
            "properties": {
              "appointmentChoices": {
                "minItems": 2
              },
              "selectedAppointmentId": {
                "type": "null"
              },
              "actorScopeKey": {
                "type": "null"
              },
              "canEnterWorkbench": {
                "const": false
              },
              "canEnterIdentityAdmin": {
                "const": false
              }
            }
          }
        },
        {
          "if": {
            "properties": {
              "state": {
                "const": "READY"
              }
            },
            "required": [
              "state"
            ]
          },
          "then": {
            "properties": {
              "appointmentChoices": {
                "minItems": 1
              },
              "selectedAppointmentId": {
                "type": "string"
              },
              "actorScopeKey": {
                "type": "string"
              }
            }
          }
        }
      ]
    }
    CreateIdentityPrincipalV1: {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "providerUserSelector",
        "displayName"
      ],
      "properties": {
        "providerUserSelector": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2048,
          "pattern": "^[A-Za-z0-9_-]+$"
        },
        "displayName": {
          "$ref": "#/components/schemas/SafeText200"
