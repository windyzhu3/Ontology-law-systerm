<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T05 · I 高保真审阅</title><style>body{font:15px "Microsoft YaHei",sans-serif;margin:0;background:#f8f7f7;color:#2c2c34}header{padding:16px 24px}select{font:inherit;padding:8px;max-width:100%}iframe{width:100%;height:calc(100vh - 170px);border:1px solid #dfe0e4;background:white;box-sizing:border-box}p{margin:8px 0}</style></head><body><header><strong>I · 客户、当事方与服务需求 · 待确认</strong><p>审阅工具：合成静态数据，不调用真实业务；沿用 E 母版，保留原跟进责任。</p><label>查看场景 <select id="scene"></select></label></header><iframe title="T05客户与需求交互" src="app.html"></iframe><script>const scenes={entry:'现有商机入口',empty:'尚未确认资料',select:'选择或新建主体',edit:'维护客户与需求',review:'一次核对确认',saved:'确认后继续原事项',waiting:'等待期间补资料',shared:'共用资料变更提示',downstream:'已有下游版本引用',stale:'依据变化需重读',unknown:'结果未知核对原回执',readonly:'只读',closed:'商机已结束',revoked:'权限变化清除资料',loading:'加载',failed:'读取失败'};document.querySelector('select').innerHTML=Object.entries(scenes).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');document.querySelector('select').onchange=e=>document.querySelector('iframe').src='app.html?scene='+e.target.value;</script></body></html>
