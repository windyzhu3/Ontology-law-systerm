<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U · 我的等待事项设计评审</title><style>*{box-sizing:border-box}body{margin:0;font:14px "Microsoft YaHei",sans-serif;background:#f8f7f7;color:#2c2c34}header{padding:16px 24px}p{margin:8px 0;line-height:1.6}select{font:inherit;padding:7px;max-width:100%}iframe{display:block;width:100%;height:calc(100vh - 210px);min-height:480px;margin:auto;border:1px solid #dfe0e4;background:white}label{display:inline-block;margin:4px 14px 4px 0}</style><header><strong>U · 我的等待事项｜已确认并实施</strong><p>沿用现有工作卡，卡下展开列表与只读详情。合成原型，不调用业务接口。</p><label>场景 <select id="scene"><option value="collapsed">默认收起</option><option value="expanded">展开列表</option><option value="detail">只读详情</option><option value="due">已到核对时间</option><option value="ready">条件满足后可办理</option><option value="dirty">前往办理时有未保存内容</option><option value="changed">点击办理时权限已变化</option><option value="loading">正在读取</option><option value="error">读取失败与重试</option><option value="revoked">失权清空</option><option value="empty">没有等待事项</option><option value="no-current">没有当前可办理事项</option><option value="many">多条与分页</option></select></label><label>宽度 <select id="width"><option value="100%">桌面</option><option value="390px">390px</option><option value="360px">360px</option></select></label><p>可操作：展开 / 收起、查看详情和记录、失败重试、加载更多，以及有未保存内容时前往办理。顶部及当前表单提交按钮仅作背景参照。</p></header><iframe title="我的等待事项设计预览" src="app.html?scene=collapsed"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#scene').onchange=e=>f.src='app.html?scene='+e.target.value;document.querySelector('#width').onchange=e=>f.style.width=e.target.value;</script></html>
