openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Ontology Law System R1 API
  version: 1.0.0
  description: >-
    The single executable R1 HTTP contract for Lead intake, task completion,
    ActionDraft persistence, Current Work Card projection, receipt recovery,
    and the mutually authenticated named due-task recovery commands.

tags:
  - name: Leads
  - name: Workbench
  - name: TaskDrafts
  - name: TaskCommands
  - name: CommandReceipts
  - name: InternalTaskCommands

paths:
  /api/v1/leads:
    post:
      tags: [Leads]
      operationId: captureLead
      summary: Capture one Lead from a source account
      security:
        - publicBearer: []
      x-tenant-source: ACTOR_CONTEXT
      x-subject-binding: SOURCE_NATURAL_KEY
      x-error-codes:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_INVALID
        - UNAUTHENTICATED
        - NOT_AUTHORIZED
        - APPOINTMENT_INACTIVE
        - COMMAND_PAYLOAD_CONFLICT
        - SUPERVISOR_UNRESOLVED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureLeadV1'
            examples:
              captureLead:
                $ref: '#/components/examples/CaptureLeadRequest'
      responses:
        '201':
          description: Lead capture reached a terminal receipt.
          headers:
            Location:
              $ref: '#/components/headers/ReceiptLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadCommandReceipt'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/PublicUnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/UnprocessableProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/UnavailableProblem'

  /api/v1/workcards/current:
    get:
      tags: [Workbench]
      operationId: getCurrentWorkCard
      summary: Read the current Actor-scoped Workbench envelope
      security:
        - publicBearer: []
      x-tenant-source: ACTOR_CONTEXT
      x-subject-binding: ACTOR_SCOPE
      x-error-codes:
        - UNAUTHENTICATED
        - NOT_AUTHORIZED
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      parameters:
        - $ref: '#/components/parameters/WorkbenchIfNoneMatch'
      responses:
        '200':
          description: Current Workbench envelope.
          headers:
            ETag:
              $ref: '#/components/headers/WorkbenchETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWorkCardEnvelope'
              examples:
                currentWorkCard:
                  $ref: '#/components/examples/CurrentWorkCardResponse'
        '304':
          description: The Actor-scoped Workbench projection is unchanged.
          headers:
            ETag:
              $ref: '#/components/headers/WorkbenchETagHeader'
        '401':
          $ref: '#/components/responses/PublicUnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/UnavailableProblem'

  /api/v1/tasks/{taskId}/draft:
    put:
      tags: [TaskDrafts]
      operationId: saveActionDraft
      summary: Create or update the current Task ActionDraft
      security:
        - publicBearer: []
      x-tenant-source: ACTOR_CONTEXT
      x-subject-binding: TASK_AND_DRAFT
      x-precondition-mode: exactly-one-of-if-none-match-star-or-if-match-draft-etag
      x-error-codes:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_INVALID
        - UNAUTHENTICATED
        - NOT_AUTHORIZED
        - APPOINTMENT_INACTIVE
        - NOT_FOUND
        - COMMAND_PAYLOAD_CONFLICT
        - TASK_NOT_OPEN
        - TASK_ALREADY_COMPLETED
        - DRAFT_DIGEST_MISMATCH
        - STALE_TASK
        - STALE_DRAFT
        - DRAFT_PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DraftIfMatch'
        - $ref: '#/components/parameters/DraftCreateIfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveActionDraftV1'
            examples:
              saveActionDraft:
                $ref: '#/components/examples/SaveActionDraftRequest'
      responses:
        '200':
          description: Existing Draft updated.
          headers:
            Location:
              $ref: '#/components/headers/ReceiptLocation'
            ETag:
              $ref: '#/components/headers/DraftETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDraftWriteResult'
        '201':
          description: Draft created.
          headers:
            Location:
              $ref: '#/components/headers/ReceiptLocation'
            ETag:
              $ref: '#/components/headers/DraftETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionDraftWriteResult'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/PublicUnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '412':
          $ref: '#/components/responses/PreconditionFailedProblem'
        '428':
          $ref: '#/components/responses/PreconditionRequiredProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/UnavailableProblem'

