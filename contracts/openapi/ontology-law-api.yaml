        '200':
          description: The exact waiting Task is reopened or was already reopened by the same selector.
          headers:
            Location:
              $ref: '#/components/headers/ReceiptLocation'
            ETag:
              $ref: '#/components/headers/TaskETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOccurrenceCommandReceipt'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/InternalUnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/UnavailableProblem'

  /internal/v1/tasks/commands/reopen-due-routing-review-tasks:
    post:
      tags: [InternalTaskCommands]
      operationId: reopenDueRoutingReviewTasks
      summary: Reopen one exact due RESOLVE_LEAD_ROUTING_GAP Task
      security:
        - internalMutualTls: []
      x-tenant-source: ACTOR_CONTEXT
      x-subject-binding: DUE_CUTOFF_AND_OWNER_QUEUE
      x-error-codes:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_INVALID
        - UNAUTHENTICATED
        - NOT_AUTHORIZED
        - COMMAND_PAYLOAD_CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenDueRoutingReviewTaskV1'
            examples:
              reopenDueRoutingReviewTask:
                $ref: '#/components/examples/ReopenDueRoutingReviewTasksRequest'
      responses:
        '200':
          description: The exact waiting routing-review Task is reopened or was already reopened by the same selector.
          headers:
            Location:
              $ref: '#/components/headers/ReceiptLocation'
            ETag:
              $ref: '#/components/headers/TaskETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOccurrenceCommandReceipt'
        '400':
          $ref: '#/components/responses/BadRequestProblem'
        '401':
          $ref: '#/components/responses/InternalUnauthorizedProblem'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '429':
          $ref: '#/components/responses/RateLimitedProblem'
        '500':
          $ref: '#/components/responses/InternalProblem'
        '503':
          $ref: '#/components/responses/UnavailableProblem'

components:
  securitySchemes:
    publicBearer:
      type: http
      scheme: bearer
    internalMutualTls:
      type: mutualTLS

  parameters:
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CommandIdPath:
      name: commandId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TaskIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/TaskETag'
    DraftIfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/DraftETag'
    DraftCreateIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        enum: ['*']
    WorkbenchIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/WorkbenchETag'

  headers:
    ReceiptLocation:
      description: Relative URI of the original terminal CommandReceipt.
      schema:
        type: string
        pattern: '^/api/v1/commands/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/receipt$'
    WorkbenchETagHeader:
      description: Strong Actor-scoped Workbench projection tag.
      schema:
        $ref: '#/components/schemas/WorkbenchETag'
    TaskETagHeader:
      description: Strong Task state and revision tag.
      schema:
        $ref: '#/components/schemas/TaskETag'
    DraftETagHeader:
      description: Strong ActionDraft state and revision tag.
      schema:
        $ref: '#/components/schemas/DraftETag'
    PublicBearerChallenge:
      description: Standard Bearer authentication challenge.
      schema:
        type: string
        pattern: '^Bearer(?: .+)?$'
    RetryAfter:
      description: Non-negative integer seconds before retry.
      schema:
        type: integer
        minimum: 0

  examples:
    CaptureLeadRequest:
      externalValue: ./examples/capture-lead.request.json
    CurrentWorkCardResponse:
      externalValue: ./examples/current-work-card.response.json
    SaveActionDraftRequest:
      externalValue: ./examples/save-action-draft.request.json
    ResolveDuplicateLeadRequest:
      externalValue: ./examples/resolve-duplicate-lead.request.json
    CompleteLeadIngressRequest:
      externalValue: ./examples/complete-lead-ingress.request.json
    AssignLeadRequest:
      externalValue: ./examples/assign-lead.request.json
    RecordRoutingDispositionRequest:
      externalValue: ./examples/record-routing-disposition.request.json
    AcknowledgeSourceIntakeStopRequestRequest:
      externalValue: ./examples/acknowledge-source-intake-stop-request.request.json
    RecordContactResultRequest:
      externalValue: ./examples/record-contact-result.request.json
    ReviewLeadValidityRequest:
      externalValue: ./examples/review-lead-validity.request.json
    CommandReceiptResponse:
      externalValue: ./examples/command-receipt.response.json
    ReopenDueContactTasksRequest:
      externalValue: ./examples/reopen-due-contact-tasks.request.json
    ReopenDueRoutingReviewTasksRequest:
      externalValue: ./examples/reopen-due-routing-review-tasks.request.json
    ProblemResponse:
      externalValue: ./examples/problem.response.json

  responses:
    DecisionRecordCommandSucceeded:
      description: The Task command completed with a Decision Record fact.
      headers:
        Location:
          $ref: '#/components/headers/ReceiptLocation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DecisionRecordCommandReceipt'
    LeadCommandSucceeded:
      description: The Task command completed with a Lead revision fact.
      headers:
        Location:
          $ref: '#/components/headers/ReceiptLocation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LeadCommandReceipt'
    LeadAssignmentCommandSucceeded:
      description: The Task command completed with a Lead Assignment revision fact.
      headers:
        Location:
          $ref: '#/components/headers/ReceiptLocation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LeadAssignmentCommandReceipt'
    LeadContactResultCommandSucceeded:
      description: The Task command completed with a Lead Contact Result digest fact.
      headers:
        Location:
          $ref: '#/components/headers/ReceiptLocation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LeadContactResultCommandReceipt'
    BadRequestProblem:
      description: Request validation or idempotency header failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PublicUnauthorizedProblem:
      description: A valid public Bearer identity is required.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/PublicBearerChallenge'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalUnauthorizedProblem:
      description: The mTLS identity passed transport but could not be mapped to an ActorContext.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenProblem:
      description: The authenticated Actor is not authorized for the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: The resource does not exist or is not visible to the Actor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConflictProblem:
      description: The request conflicts with a terminal command, Task, Draft, or subject state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailedProblem:
      description: A supplied strong precondition no longer matches.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            staleTask:
              $ref: '#/components/examples/ProblemResponse'
    UnprocessableProblem:
      description: A required deterministic owner cannot be resolved uniquely.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequiredProblem:
      description: A required Task or Draft precondition header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitedProblem:
      description: The caller is rate limited.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalProblem:
      description: The service could not complete the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnavailableProblem:
      description: The service is temporarily unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # Scalar wire types
    Uuid:
      type: string
      format: uuid
    Revision:
      type: integer
      format: int64
      minimum: 0
      maximum: 9007199254740991
      description: JSON safe integer revision; values outside this range are rejected without coercion.
    Instant:
      type: string
      format: date-time
    Code64:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,63}$'
    OpaqueRef:
      type: string
      minLength: 16
      maxLength: 512
    Digest32:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    SafeText200:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
    SafeText500:
      type: string
      minLength: 1
      maxLength: 500
      pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
    SafeText2000:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
    DraftText200:
      type: string
      maxLength: 200
      pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'
    DraftText500:
      type: string
      maxLength: 500
      pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'
    DraftText2000:
      type: string
      maxLength: 2000
      pattern: '^[^\u0000-\u001F\u007F-\u009F]*$'
    WorkbenchETag:
      type: string
      pattern: '^"wb\.[A-Za-z0-9_-]{43}"$'
    TaskETag:
      type: string
      pattern: '^"task\.[A-Za-z0-9_-]{43}"$'
    DraftETag:
      type: string
      pattern: '^"draft\.[A-Za-z0-9_-]{43}"$'
    SubjectETag:
      type: string
      pattern: '^"subject\.[A-Za-z0-9_-]{43}"$'

    CaptureLeadV1:
      type: object
      additionalProperties: false
      required:
        - sourceChannelCode
        - sourceAccountCode
        - sourceRecordKey
        - capturedAt
        - serviceCategoryCode
        - jurisdictionCode
        - urgencyCode
        - legalNeedSummary
      properties:
        sourceChannelCode:
          $ref: '#/components/schemas/Code64'
        sourceAccountCode:
          type: string
          minLength: 1
          maxLength: 128
        sourceRecordKey:
          type: string
          minLength: 1
          maxLength: 256
        capturedAt:
          $ref: '#/components/schemas/Instant'
        capturedName:
          $ref: '#/components/schemas/SafeText200'
        phone:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^\+[1-9][0-9]{0,14}$'
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
        cityCode:
          $ref: '#/components/schemas/Code64'
        serviceCategoryCode:
          $ref: '#/components/schemas/Code64'
        jurisdictionCode:
          $ref: '#/components/schemas/Code64'
        urgencyCode:
          $ref: '#/components/schemas/Code64'
        legalNeedSummary:
          $ref: '#/components/schemas/SafeText2000'

    ResolveDuplicateLeadValuesV1:
      type: object
      additionalProperties: false
      required:
        - decisionCode
        - candidateLeadId
        - candidateLeadRevision
        - partyId
        - partyRevision
        - rationaleSummary
      properties:
        decisionCode:
          type: string
          enum: [LINK_EXISTING_PARTY, KEEP_SEPARATE]
        candidateLeadId:
          $ref: '#/components/schemas/Uuid'
        candidateLeadRevision:
          $ref: '#/components/schemas/Revision'
        partyId:
          $ref: '#/components/schemas/Uuid'
        partyRevision:
          $ref: '#/components/schemas/Revision'
        rationaleSummary:
          $ref: '#/components/schemas/SafeText500'

    CompleteLeadIngressValuesV1:
      type: object
      additionalProperties: false
      required: [sourceCode, sourceSummary]
      properties:
        phone:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^\+[1-9][0-9]{0,14}$'
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
        sourceCode:
          $ref: '#/components/schemas/LeadIngressSourceCode'
        sourceSummary:
          $ref: '#/components/schemas/SafeText500'
      oneOf:
        - $ref: '#/components/schemas/CompleteLeadIngressPhoneOnlyValuesV1'
        - $ref: '#/components/schemas/CompleteLeadIngressEmailOnlyValuesV1'
        - $ref: '#/components/schemas/CompleteLeadIngressPhoneAndEmailValuesV1'

    CompleteLeadIngressPhoneOnlyValuesV1:
      type: object
      additionalProperties: false
      required: [phone, sourceCode, sourceSummary]
      properties:
        phone:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^\+[1-9][0-9]{0,14}$'
        sourceCode:
          $ref: '#/components/schemas/LeadIngressSourceCode'
        sourceSummary:
          $ref: '#/components/schemas/SafeText500'

    CompleteLeadIngressEmailOnlyValuesV1:
      type: object
      additionalProperties: false
      required: [email, sourceCode, sourceSummary]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
        sourceCode:
          $ref: '#/components/schemas/LeadIngressSourceCode'
        sourceSummary:
          $ref: '#/components/schemas/SafeText500'

    CompleteLeadIngressPhoneAndEmailValuesV1:
      type: object
      additionalProperties: false
      required: [phone, email, sourceCode, sourceSummary]
      properties:
        phone:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^\+[1-9][0-9]{0,14}$'
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
        sourceCode:
          $ref: '#/components/schemas/LeadIngressSourceCode'
        sourceSummary:
          $ref: '#/components/schemas/SafeText500'

    AssignLeadValuesV1:
      type: object
      additionalProperties: false
      required: [ownerAppointmentId]
      properties:
        ownerAppointmentId:
          $ref: '#/components/schemas/Uuid'

    RecordRoutingDispositionValuesV1:
      type: object
      additionalProperties: false
      required: [decisionCode, rationaleSummary]
      properties:
        decisionCode:
          type: string
          enum:
            - SCHEDULE_ROUTING_REVIEW
            - RETRY_ASSIGNMENT_NOW
            - REQUEST_SOURCE_INTAKE_STOP
        rationaleSummary:
          $ref: '#/components/schemas/SafeText500'

    AcknowledgeSourceIntakeStopRequestValuesV1:
      type: object
      additionalProperties: false
      required: [causalDecisionId, causalDecisionHash, rationaleSummary]
      properties:
        causalDecisionId:
          $ref: '#/components/schemas/Uuid'
        causalDecisionHash:
          $ref: '#/components/schemas/Digest32'
        rationaleSummary:
          $ref: '#/components/schemas/SafeText500'

    RecordContactResultValuesV1:
      type: object
      additionalProperties: false
      required:
        - leadAssignmentId
        - leadAssignmentRevision
        - contactChannelCode
        - resultCode
      properties:
        leadAssignmentId:
          $ref: '#/components/schemas/Uuid'
        leadAssignmentRevision:
          $ref: '#/components/schemas/Revision'
        contactChannelCode:
          type: string
          enum: [PHONE, EMAIL]
        resultCode:
          $ref: '#/components/schemas/ContactResultCode'
        resultSummary:
          $ref: '#/components/schemas/SafeText500'
        legalNeed:
          $ref: '#/components/schemas/SafeText2000'
        evidenceSubmissionId:
          $ref: '#/components/schemas/Uuid'
      allOf:
        - if:
            properties:
              resultCode:
                enum: [CONNECTED_VALID]
            required: [resultCode]
          then:
            required: [legalNeed]
          else:
            not:
              required: [legalNeed]
      discriminator:
        propertyName: resultCode
        mapping:
          CONNECTED_VALID: '#/components/schemas/ConnectedValidRecordContactResultValuesV1'
          NOT_CONNECTED: '#/components/schemas/NotConnectedRecordContactResultValuesV1'
          SUSPECT_INVALID: '#/components/schemas/SuspectInvalidRecordContactResultValuesV1'
      oneOf:
        - $ref: '#/components/schemas/ConnectedValidRecordContactResultValuesV1'
        - $ref: '#/components/schemas/NotConnectedRecordContactResultValuesV1'
        - $ref: '#/components/schemas/SuspectInvalidRecordContactResultValuesV1'

    ConnectedValidRecordContactResultValuesV1:
      type: object
      additionalProperties: false
      required: [leadAssignmentId, leadAssignmentRevision, contactChannelCode, resultCode, legalNeed]
      properties:
        leadAssignmentId:
          $ref: '#/components/schemas/Uuid'
        leadAssignmentRevision:
          $ref: '#/components/schemas/Revision'
        contactChannelCode:
          type: string
          enum: [PHONE, EMAIL]
        resultCode:
          $ref: '#/components/schemas/ContactResultCode'
          const: CONNECTED_VALID
        resultSummary:
          $ref: '#/components/schemas/SafeText500'
        legalNeed:
          $ref: '#/components/schemas/SafeText2000'
        evidenceSubmissionId:
          $ref: '#/components/schemas/Uuid'

    NotConnectedRecordContactResultValuesV1:
      type: object
      additionalProperties: false
      required: [leadAssignmentId, leadAssignmentRevision, contactChannelCode, resultCode]
      properties:
        leadAssignmentId:
          $ref: '#/components/schemas/Uuid'
        leadAssignmentRevision:
          $ref: '#/components/schemas/Revision'
        contactChannelCode:
          type: string
          enum: [PHONE, EMAIL]
        resultCode:
          $ref: '#/components/schemas/ContactResultCode'
          const: NOT_CONNECTED
        resultSummary:
          $ref: '#/components/schemas/SafeText500'
        legalNeed: false
        evidenceSubmissionId:
          $ref: '#/components/schemas/Uuid'

    SuspectInvalidRecordContactResultValuesV1:
      type: object
      additionalProperties: false
      required: [leadAssignmentId, leadAssignmentRevision, contactChannelCode, resultCode]
      properties:
        leadAssignmentId:
          $ref: '#/components/schemas/Uuid'
        leadAssignmentRevision:
          $ref: '#/components/schemas/Revision'
        contactChannelCode:
          type: string
          enum: [PHONE, EMAIL]
        resultCode:
          $ref: '#/components/schemas/ContactResultCode'
          const: SUSPECT_INVALID
        resultSummary:
          $ref: '#/components/schemas/SafeText500'
        legalNeed: false
        evidenceSubmissionId:
          $ref: '#/components/schemas/Uuid'

    ReviewLeadValidityValuesV1:
      type: object
      additionalProperties: false
      required:
        - triggeringContactResultId
        - triggeringContactResultHash
        - decisionCode
        - rationaleSummary
      properties:
        triggeringContactResultId:
          $ref: '#/components/schemas/Uuid'
        triggeringContactResultHash:
          $ref: '#/components/schemas/Digest32'
        decisionCode:
          type: string
          enum: [CONFIRM_INVALID, CLOSE_UNREACHED, REOPEN_CONTACT]
        rationaleSummary:
          $ref: '#/components/schemas/SafeText500'

    ActionCode:
      type: string
      enum:
        - RESOLVE_DUPLICATE_LEAD
        - COMPLETE_LEAD_INGRESS
        - ASSIGN_LEAD
        - RECORD_ROUTING_DISPOSITION
        - ACKNOWLEDGE_SOURCE_INTAKE_STOP_REQUEST
        - RECORD_CONTACT_RESULT
        - REVIEW_LEAD_VALIDITY

    ContactResultCode:
      type: string
      enum: [CONNECTED_VALID, NOT_CONNECTED, SUSPECT_INVALID]

    LeadIngressSourceCode:
      type: string
      enum: [OWNER_CONFIRMED, CUSTOMER_PROVIDED]

    DraftLeadIngressSourceCode:
      type: string
      enum: ['', OWNER_CONFIRMED, CUSTOMER_PROVIDED]

    PublicFactType:
      type: string
      enum:
        - LEAD
        - ACTION_DRAFT
        - TASK_OCCURRENCE
        - DECISION_RECORD
        - LEAD_ASSIGNMENT
        - LEAD_CONTACT_RESULT

    TaskType:
      type: string
      enum:
        - RESOLVE_LEAD_DUPLICATE
        - COMPLETE_LEAD_INGRESS
        - ASSIGN_LEAD
        - RESOLVE_LEAD_ROUTING_GAP
        - ACK_SOURCE_INTAKE_STOP_REQUEST
        - CONTACT_LEAD
        - REVIEW_LEAD_VALIDITY

    SchemaVersionV1:
      type: integer
      enum: [1]

    SaveActionDraftV1:
      type: object
      additionalProperties: false
      required: [actionCode, schemaVersion, values]
      properties:
        actionCode:
          $ref: '#/components/schemas/ActionCode'
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersionV1'
        values:
          oneOf:
            - $ref: '#/components/schemas/ResolveDuplicateLeadValuesV1'
            - $ref: '#/components/schemas/CompleteLeadIngressValuesV1'
            - $ref: '#/components/schemas/AssignLeadValuesV1'
            - $ref: '#/components/schemas/RecordRoutingDispositionValuesV1'
            - $ref: '#/components/schemas/AcknowledgeSourceIntakeStopRequestValuesV1'
            - $ref: '#/components/schemas/RecordContactResultValuesV1'
            - $ref: '#/components/schemas/ReviewLeadValidityValuesV1'
      discriminator:
        propertyName: actionCode
        mapping:
          RESOLVE_DUPLICATE_LEAD: '#/components/schemas/ResolveDuplicateLeadDraftBinding'
          COMPLETE_LEAD_INGRESS: '#/components/schemas/CompleteLeadIngressDraftBinding'
          ASSIGN_LEAD: '#/components/schemas/AssignLeadDraftBinding'
          RECORD_ROUTING_DISPOSITION: '#/components/schemas/RecordRoutingDispositionDraftBinding'
          ACKNOWLEDGE_SOURCE_INTAKE_STOP_REQUEST: '#/components/schemas/AcknowledgeSourceIntakeStopRequestDraftBinding'
          RECORD_CONTACT_RESULT: '#/components/schemas/RecordContactResultDraftBinding'
          REVIEW_LEAD_VALIDITY: '#/components/schemas/ReviewLeadValidityDraftBinding'
      oneOf:
        - $ref: '#/components/schemas/ResolveDuplicateLeadDraftBinding'
        - $ref: '#/components/schemas/CompleteLeadIngressDraftBinding'
        - $ref: '#/components/schemas/AssignLeadDraftBinding'
        - $ref: '#/components/schemas/RecordRoutingDispositionDraftBinding'
        - $ref: '#/components/schemas/AcknowledgeSourceIntakeStopRequestDraftBinding'
        - $ref: '#/components/schemas/RecordContactResultDraftBinding'
        - $ref: '#/components/schemas/ReviewLeadValidityDraftBinding'

    ResolveDuplicateLeadDraftBinding:
      type: object
      additionalProperties: false
      required: [actionCode, schemaVersion, values]
      properties:
        actionCode:
          $ref: '#/components/schemas/ActionCode'
          const: RESOLVE_DUPLICATE_LEAD
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersionV1'
        values:
          $ref: '#/components/schemas/ResolveDuplicateLeadValuesV1'

    CompleteLeadIngressDraftBinding:
      type: object
      additionalProperties: false
      required: [actionCode, schemaVersion, values]
      properties:
        actionCode:
          $ref: '#/components/schemas/ActionCode'
          const: COMPLETE_LEAD_INGRESS
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersionV1'
        values:
          $ref: '#/components/schemas/CompleteLeadIngressValuesV1'

    AssignLeadDraftBinding:
      type: object
      additionalProperties: false
      required: [actionCode, schemaVersion, values]
      properties:
        actionCode:
          $ref: '#/components/schemas/ActionCode'
          const: ASSIGN_LEAD
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersionV1'
        values:
          $ref: '#/components/schemas/AssignLeadValuesV1'

    RecordRoutingDispositionDraftBinding:
